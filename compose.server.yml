services:
  factory:
    build: .
    restart: unless-stopped
    env_file:
      - deploy/server.env
    environment:
      FACTORY_BIND: 0.0.0.0
      FACTORY_PORT: "8765"
      FACTORY_DB: /data/factory.db
      FACTORY_PUBLIC_ORIGIN: https://${FACTORY_DOMAIN:?请配置站点域名}
      FACTORY_PROXY_TOKEN: ${FACTORY_PROXY_TOKEN:?请配置代理令牌}
    volumes:
      - factory_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8765/api/factory/state',headers={'Host':os.environ['FACTORY_PUBLIC_ORIGIN'].split('://')[1],'X-Factory-Proxy':os.environ['FACTORY_PROXY_TOKEN']}); urllib.request.urlopen(r,timeout=5).read()"
      interval: 30s
      timeout: 6s
      retries: 3
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      factory:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      FACTORY_DOMAIN: ${FACTORY_DOMAIN:?请配置站点域名}
      FACTORY_ADMIN_USER: ${FACTORY_ADMIN_USER:?请配置登录用户名}
      FACTORY_ADMIN_PASSWORD_HASH: ${FACTORY_ADMIN_PASSWORD_HASH:?请配置密码哈希}
      FACTORY_PROXY_TOKEN: ${FACTORY_PROXY_TOKEN:?请配置代理令牌}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
volumes:
  factory_data:
  caddy_data:
  caddy_config:
